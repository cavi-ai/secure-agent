sensitive_globs:
  - "**/.env"
  - "**/.env.*"
  - "~/.ssh/id_*"
  - "~/.ssh/*_rsa"
  - "~/.ssh/*_ed25519"
  - "~/.aws/credentials"
  - "~/.config/gh/hosts.yml"
sensitive_paths:
  - "~/.aws"
  - "~/.ssh"
# Directories under a sensitive path that hold no secret; checked before
# sensitive_paths and sensitive_globs. zsh reads ~/.docker/completions (on
# fpath) at every shell start.
not_secret_paths:
  - "~/.docker/completions"
keychain_markers:
  - "library/keychains"
  - ".keychain-db"
  - "login.keychain"
agents:
  # The Claude desktop app hosts one claude process per Code conversation.
  # Listed as infra BEFORE claude (first match wins) so a conversation's
  # family root is its own claude process, not the app: the session ends
  # when that conversation's process exits, not when the app quits.
  - { name: claude-desktop, match: ["/Applications/Claude.app/"], kind: infra }
  - { name: claude,      match: ["claude"] }
  # The Cursor IDE is infrastructure, not an agent — it must be listed BEFORE
  # the cursor CLI entry (first match wins) so Cursor.app and its helpers are
  # classified infra while the cursor CLI harness stays an agent.
  - { name: cursor-ide,  match: ["Cursor.app", "Cursor Helper"], kind: infra }
  - { name: cursor,      match: ["cursor"] }
  - { name: codex,       match: ["codex"] }
  - { name: opencode,    match: ["opencode", "OpenCode Helper"] }
  - { name: antigravity, match: ["antigravity", "Antigravity Helper"] }
  - { name: windsurf,    match: ["windsurf"] }
  - { name: aider,       match: ["aider"] }
  - { name: gemini,      match: ["gemini-cli", "gemini"] }
  - { name: codeium,     match: ["codeium"] }
  - { name: copilot,     match: ["copilot"] }
  - { name: openclaw,    match: ["/.openclaw/"] }
  - { name: hermes,      match: ["hermes-agent", "/.hermes/"] }
  # Local model infrastructure: tracked (killable, monitored) but their
  # loopback traffic is never flagged — they're what the advisor talks to.
  # kind: infra keeps them out of agent/session counts and reclaimable memory.
  - { name: ollama,      match: ["ollama", "llama-server", "llama.cpp"], kind: infra }
  - { name: lm-studio,   match: ["lm studio", "lmstudio"], kind: infra }
vendor_allowlist:
  claude:      ["anthropic.com", "claude.ai"]
  cursor:      ["cursor.sh", "cursor.com"]
  cursor-ide:  ["cursor.sh", "cursor.com"]
  codex:       ["openai.com", "api.openai.com"]
  opencode:    ["opencode.ai"]
  antigravity: ["anthropic.com"]
  windsurf:    ["codeium.com"]
  aider:       ["aider.chat"]
  gemini:      ["googleapis.com", "generativelanguage.googleapis.com"]
  codeium:     ["codeium.com"]
  copilot:     ["githubcopilot.com", "copilot-proxy.githubusercontent.com"]
  ollama:      ["ollama.com", "ollama.ai"]
  lm-studio:   ["lmstudio.ai"]
# The orgs each credential is meant for (correlate.Identify names). A
# connection to one of them from the reader's process tree (the reader, its
# ancestors, its descendants) is counted as the credential in use; any other
# destination, or a process outside that tree, still flags.
credential_owners:
  - { path: "~/.config/gh/hosts.yml", orgs: ["GitHub"] }
  - { path: "~/.aws",                 orgs: ["AWS", "AWS CloudFront"] }
  - { path: "~/.azure",               orgs: ["Azure", "Microsoft"] }
  - { path: "~/.config/gcloud",       orgs: ["Google", "Google Cloud"] }
  - { path: "~/.docker",              orgs: ["Docker Hub", "Docker", "GitHub Container Registry"] }
net_sample_interval_ms: 2000
# Time-based event retention, per kind. Socket churn (conn open/close) ages
# out fast so it cannot evict the security record; everything else keeps a
# week. A row-count cap remains as a backstop.
retention:
  conn_event_hours: 24
  event_days: 7
socket_path: "~/.config/secure-agent/daemon.sock"
db_path: "~/.local/state/secure-agent/events.db"
jsonl_path: "~/.local/state/secure-agent/events.jsonl"
proxy_enabled: false
proxy_port: 8443
proxy_ca_cert_path: "~/.config/secure-agent/ca.crt"
proxy_ca_key_path: "~/.config/secure-agent/ca.key"
firewall:
  mode: monitor
  registry:
    salt_ref: "~/.config/secure-agent/fw-salt"
    ingest_sources:
      - "~/.env"
      - "~/.aws/credentials"
    fingerprints: []
  patterns:
    - { id: anthropic-key, type: vendor-key,  re: 'sk-ant-[A-Za-z0-9_-]{24,}', mode: monitor }
    - { id: openai-key,    type: vendor-key,  re: 'sk-[A-Za-z0-9]{32,}',       mode: monitor }
    - { id: github-pat,    type: vendor-key,  re: 'gh[pousr]_[A-Za-z0-9]{36,}', mode: monitor }
    - { id: aws-key,       type: cloud-key,   re: 'AKIA[0-9A-Z]{16}',          mode: monitor }
    - { id: google-key,    type: cloud-key,   re: 'AIza[0-9A-Za-z_-]{35}',     mode: monitor }
    - { id: stripe-key,    type: vendor-key,  re: 'sk_live_[0-9A-Za-z]{24,}',  mode: monitor }
    - { id: slack-token,   type: vendor-key,  re: 'xox[baprs]-[0-9A-Za-z-]{10,}', mode: monitor }
    - { id: private-key,   type: private-key, re: '-----BEGIN [A-Z ]*PRIVATE KEY-----', mode: monitor }
    - { id: jwt,           type: vendor-key,  re: 'eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}', mode: monitor }
    - { id: bearer-token,  type: vendor-key,  re: 'Bearer\s+[A-Za-z0-9\-._~+/]{16,}=*', mode: monitor }
    - { id: openai-project,   type: vendor-key,   re: 'sk-proj-[A-Za-z0-9_-]{40,}',          mode: monitor }
    - { id: github-fine-grained, type: vendor-key, re: 'github_pat_[0-9A-Za-z_]{82}',        mode: monitor }
    - { id: gitlab-pat,       type: vendor-key,   re: 'glpat-[0-9A-Za-z_-]{20}',             mode: monitor }
    - { id: npm-token,        type: vendor-key,   re: 'npm_[0-9A-Za-z]{36}',                 mode: monitor }
    - { id: pypi-token,       type: vendor-key,   re: 'pypi-[A-Za-z0-9_-]{50,}',             mode: monitor }
    - { id: sendgrid-key,     type: vendor-key,   re: 'SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}', mode: monitor }
    - { id: twilio-sid,       type: cloud-key,    re: 'AC[0-9a-fA-F]{32}',                   mode: monitor }
    - { id: stripe-restricted, type: vendor-key,  re: 'rk_live_[0-9A-Za-z]{24,}',            mode: monitor }
    - { id: stripe-webhook,   type: vendor-key,   re: 'whsec_[A-Za-z0-9]{32,}',              mode: monitor }
    - { id: digitalocean-token, type: cloud-key,  re: 'dop_v1_[0-9a-f]{64}',                 mode: monitor }
    - { id: doppler-token,    type: vendor-key,   re: 'dp\.pt\.[A-Za-z0-9]{40,}',            mode: monitor }
    - { id: db-conn-string,   type: cloud-key,    re: '(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqps?)://\S+:\S+@\S+', mode: monitor }
  entropy: { enabled: true, min_len: 20, min_bits: 4.0, mode: monitor }
  vendors:
    claude: { hosts: ["api.anthropic.com","claude.ai"], auth_header: "authorization" }
    cursor: { hosts: ["cursor.sh","cursor.com"],        auth_header: "authorization" }
    codex:  { hosts: ["api.openai.com"],                auth_header: "authorization" }
  context:
    allow_own_vendor_auth: true
    treat_body_secret_as_leak: true
directory_guard:
  prompt_deadline_ms: 45000

# Whole-session resource budgets. Limits of zero disable enforcement for that
# metric. Observe is the safe default; prompt/terminate require explicit opt-in.
resource_control:
  mode: observe
  max_rss_mb: 0
  max_cpu_percent: 0
  sustain_seconds: 30
  cooldown_seconds: 300
  workspace_overrides: []

# Local triage advisor (opt-in): a locally served model gives a second opinion
# on flags and incidents. Loopback-only, enforced in code. See
# docs/ADVISOR_THREAT_MODEL.md.
advisor:
  enabled: false                    # opt in after serving a local model
  endpoint: "http://127.0.0.1:8080" # must be loopback — anything else is rejected
  model: ""                         # model name the server expects
  timeout_ms: 8000
  # Managed mode: the daemon spawns + supervises the model server itself
  # (endpoint derived; do not set one). Path B instead: leave managed false
  # and point endpoint at a server you already run (Ollama/MLX/llama.cpp).
  managed: false
  managed_model: "mlx-community/Qwen3-4B-4bit"

# System agent (opt-in): the console's Agent tab. Chat with a model served by
# a LOCAL Ollama, which drafts plans and dispatches Claude Code, Codex,
# OpenClaw or Hermes Agent run against that same Ollama — the work never
# reaches a vendor model. Loopback-only, enforced in code. See
# docs/SYSTEM_AGENT.md.
system_agent:
  enabled: false
  endpoint: "http://127.0.0.1:11434" # Ollama; must be loopback
  model: ""                          # chat model ("" = first model Ollama lists)
  harness_model: ""                  # model dispatched harnesses run ("" = model)
  timeout_minutes: 30                # bound on one headless dispatch

# OpenTelemetry trace export (opt-in). Sessions and trace events are exported
# as OTLP/HTTP JSON spans to any backend; empty endpoint disables it. No
# secrets cross this wire. See docs/CONFIGURATION.md.
otlp:
  endpoint: ""                      # e.g. "http://127.0.0.1:4318/v1/traces"
  service: "secure-agent"
  headers: {}
  labels: {}
# Worktree hunter (`secure-agent worktrees`, console Worktrees tab). Repos are
# found from agent sessions, the usual worktree directories and a saved list;
# roots adds directories to search for repos (depth 3).
worktrees:
  roots: []
  stale_days: 14                    # idle age that marks a worktree stale
