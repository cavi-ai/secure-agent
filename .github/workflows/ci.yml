name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-go:
    name: Go Tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Unit & Integration Tests
        run: go test -v ./...

  test-python:
    name: Python Hook Tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Plugin Hook Tests
        run: |
          python3 plugin/hooks/test_secret_guard.py
          python3 plugin/hooks/test_injection_scan.py
          python3 plugin/hooks/test_activity_log.py

  test-swift:
    name: Swift Menubar Tests
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Swift Package Tests
        run: swift test --package-path menubar

  e2e-smoke:
    name: E2E Smoke Test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run E2E Smoke Test
        run: ./packaging/test/e2e_smoke.sh
