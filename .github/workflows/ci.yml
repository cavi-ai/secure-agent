name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go vet + test + fmt
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt check
        run: test -z "$(gofmt -l daemon cmd)" || { gofmt -l daemon cmd; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1 -race

  hooks:
    name: Python hook tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: secret_guard
        run: python3 plugin/hooks/test_secret_guard.py
      - name: injection_scan
        run: python3 plugin/hooks/test_injection_scan.py
      - name: activity_log
        run: python3 plugin/hooks/test_activity_log.py

  menubar:
    name: Swift package tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: swift test
        run: swift test --package-path menubar

  e2e:
    name: E2E smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: smoke
        run: ./packaging/test/e2e_smoke.sh

  secrets:
    name: Secret scan (self)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C /usr/local/bin gitleaks
      - name: Scan repository
        run: gitleaks git --redact --verbose
