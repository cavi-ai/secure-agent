name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded PR/push runs. Deploys are not in this workflow.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no job here needs more than read access to the repo.
permissions:
  contents: read

jobs:
  go:
    name: Go vet + test + fmt
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (SHA-pinned)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5 (SHA-pinned)
        with:
          go-version-file: go.mod
      - name: gofmt check
        run: test -z "$(gofmt -l daemon cmd)" || { gofmt -l daemon cmd; exit 1; }
      - name: go vet
        run: go vet ./...
      # -race requires cgo. Production builds are CGO_ENABLED=0 (linux job).
      - name: go test
        run: go test ./... -count=1 -race -shuffle=on -timeout 10m

  hooks:
    name: Python hook tests
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (SHA-pinned)
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5 (SHA-pinned)
        with:
          python-version: "3.11"
      - name: secret_guard
        run: python3 plugin/hooks/test_secret_guard.py
      - name: injection_scan
        run: python3 plugin/hooks/test_injection_scan.py
      - name: activity_log
        run: python3 plugin/hooks/test_activity_log.py

  menubar:
    name: Swift package tests
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (SHA-pinned)
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2 (SHA-pinned)
        with:
          swift-version: "6.0"
      - name: swift test
        run: swift test --package-path menubar

  e2e:
    name: E2E smoke
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (SHA-pinned)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5 (SHA-pinned)
        with:
          go-version-file: go.mod
      - name: smoke
        run: ./packaging/test/e2e_smoke.sh
      - name: sign identity unit tests
        run: bash packaging/test/test_sign_identity.sh
      - name: install status unit tests
        run: bash packaging/test/test_install_status.sh

  linux:
    name: Linux CGO=0 build + vet + test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (SHA-pinned)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5 (SHA-pinned)
        with:
          go-version-file: go.mod
      - name: no cgo sources
        run: |
          out="$(go list -f '{{if .CgoFiles}}{{.ImportPath}} {{.CgoFiles}}{{end}}' ./...)"
          test -z "$out" || { echo "cgo sources forbidden: $out"; exit 1; }
      - name: go build
        run: go build -trimpath ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1 -shuffle=on -timeout 8m
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (SHA-pinned)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5 (SHA-pinned)
        with:
          go-version-file: go.mod
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: scan
        run: govulncheck ./...

  console:
    name: Console asset lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (SHA-pinned)
        with:
          persist-credentials: false
      - name: no personal paths guard
        run: ./packaging/test/check_no_personal_paths.sh
      - name: css token & keyframes guard
        run: ./packaging/test/check_console_css.sh
      - name: console js unit tests
        run: node --test 'packaging/test/console/*.test.mjs'
      - name: console dom tests (headless chrome)
        run: python3 packaging/test/console_dom/run_dom_tests.py

  secrets:
    name: Secret scan (self)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (SHA-pinned)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C /usr/local/bin gitleaks
      - name: Scan repository
        run: gitleaks git --redact --verbose
