name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job here needs more than read access to the repo.
permissions:
  contents: read

jobs:
  go:
    name: Go vet + test + fmt
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned)
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 (SHA-pinned)
        with:
          go-version-file: go.mod
      - name: gofmt check
        run: test -z "$(gofmt -l daemon cmd)" || { gofmt -l daemon cmd; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1 -race

  hooks:
    name: Python hook tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (SHA-pinned)
        with:
          python-version: "3.11"
      - name: secret_guard
        run: python3 plugin/hooks/test_secret_guard.py
      - name: injection_scan
        run: python3 plugin/hooks/test_injection_scan.py
      - name: activity_log
        run: python3 plugin/hooks/test_activity_log.py

  menubar:
    name: Swift package tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned)
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2 (SHA-pinned)
        with:
          swift-version: "6.0"
      - name: swift test
        run: swift test --package-path menubar

  e2e:
    name: E2E smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned)
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 (SHA-pinned)
        with:
          go-version-file: go.mod
      - name: smoke
        run: ./packaging/test/e2e_smoke.sh

  linux:
    name: Linux build + vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned)
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5 (SHA-pinned)
        with:
          go-version-file: go.mod
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1

  console:
    name: Console asset lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned)
      - name: css token & keyframes guard
        run: ./packaging/test/check_console_css.sh
      - name: console js unit tests
        run: node --test 'packaging/test/console/*.test.mjs'
      - name: console dom tests (headless chrome)
        run: python3 packaging/test/console_dom/run_dom_tests.py

  secrets:
    name: Secret scan (self)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SHA-pinned)
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C /usr/local/bin gitleaks
      - name: Scan repository
        run: gitleaks git --redact --verbose
