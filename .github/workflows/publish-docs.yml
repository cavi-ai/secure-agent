name: Publish product documentation

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing product tag (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Attach docs to the existing published stable release
        required: true
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      publish:
        required: false
        default: false
        type: boolean
    secrets:
      CONSUMER_DISPATCH_TOKEN:
        required: false

permissions: {}

concurrency:
  group: product-docs-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    # A caller passing a tag (release validation, after promotion) decides;
    # a pre-release's own published event does not build documentation.
    if: inputs.tag != '' || github.event_name != 'release' || !github.event.release.prerelease
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOCS_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DOCS_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Check and archive the tagged documentation
        run: |
          make docs-check docs-test
          python3 packaging/docs/build.py archive --version "${DOCS_TAG#v}" --release-tag "$DOCS_TAG"
          python3 packaging/docs/publish.py --tag "$DOCS_TAG"
      - name: Retain the verified release documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secure-agent-docs-${{ env.DOCS_TAG }}
          path: |
            dist/secure-agent-docs-*.tar.gz
            dist/secure-agent-docs-*.tar.gz.sha256
            dist/secure-agent-docs-*.release.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'release' || inputs.publish
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOCS_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DOCS_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: secure-agent-docs-${{ env.DOCS_TAG }}
          path: dist
      - name: Attach immutable docs assets to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_REPOSITORY: ${{ github.repository }}
          DOCS_NOTIFY_CAVI_HOME: ${{ vars.DOCS_NOTIFY_CAVI_HOME }}
          CONSUMER_DISPATCH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: |
          options=()
          if [[ "$DOCS_NOTIFY_CAVI_HOME" == "true" ]]; then
            options+=(--notify-cavi-home)
          fi
          python3 packaging/docs/publish.py --tag "$DOCS_TAG" --repo "$DOCS_REPOSITORY" --publish "${options[@]}"
