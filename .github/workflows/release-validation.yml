name: Release validation

# A tagged manual run builds into a draft and publishes only after validation.
# Published pre-releases can also be validated and promoted.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Build, validate and publish an existing draft tag (vX.Y.Z); leave blank for source checks
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-validation-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release source and credentials
    # Draft releases are visible only with push access.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$EVENT_TAG}"
          sha="$GITHUB_SHA"
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag' >&2; exit 1; }
            sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          fi
          if [[ -n "$INPUT_TAG" ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Run tagged releases from main' >&2; exit 1; }
            git merge-base --is-ancestor "$sha" origin/main
            draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            [[ "$draft" == true ]] || { echo 'The release must be a draft' >&2; exit 1; }
          fi
          printf 'sha=%s\ntag=%s\n' "$sha" "$tag" >> "$GITHUB_OUTPUT"
      - name: Check signing secrets before building
        if: inputs.tag != ''
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bash packaging/ci_release.sh check

  build:
    name: Build signed and notarized DMG
    needs: prepare
    if: inputs.tag != ''
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: release-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/go.mod
      - name: Install the vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Sign, notarize and package the tagged source
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: bash release-tools/packaging/ci_release.sh build "$GITHUB_WORKSPACE/source" "$TAG"
      - name: Upload validated distribution artifacts to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "source/dist/SecureAgent-${TAG}.dmg" source/dist/checksums.txt

  macos-go:
    name: macOS Go vet + test + fmt
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # gofmt, go vet, go test -race, as in ordinary CI.
      - name: make test-go
        run: make test-go

  menubar:
    name: Swift package tests (macOS 27 SDK)
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: swift test
        run: bash packaging/swift_macos.sh test --package-path menubar
      - name: Native status item lifecycle regression
        run: bash packaging/test/test_status_item_lifecycle.sh

  e2e:
    name: E2E smoke
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: smoke
        run: ./packaging/test/e2e_smoke.sh
      - name: sign identity unit tests
        run: bash packaging/test/test_sign_identity.sh
      - name: Developer ID export unit tests
        run: bash packaging/test/test_devid_export.sh
      - name: vcs stamp unit tests
        run: bash packaging/test/test_vcs_stamp.sh
      - name: install status unit tests
        run: bash packaging/test/test_install_status.sh
      - name: replaced bundle unit tests
        run: bash packaging/test/test_replaced_bundle.sh
      - name: live acceptance unit tests
        run: python3 packaging/test/test_live_acceptance.py

  dmg:
    name: Released app signature, notarization and version
    permissions:
      contents: write
    needs: [prepare, build]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (github.event_name == 'release' || needs.build.result == 'success')
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: verify the attached DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REQUIRE_SIGNED_DMG: ${{ inputs.tag != '' }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir" --pattern "SecureAgent-${TAG}.dmg" --pattern checksums.txt
          cd "$dir"
          want="$(awk -v f="dist/SecureAgent-${TAG}.dmg" '$2 == f {print $1}' checksums.txt)"
          got="$(shasum -a 256 "SecureAgent-${TAG}.dmg" | awk '{print $1}')"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "checksum ${got}, checksums.txt ${want:-none}" >&2; exit 1; }
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "SecureAgent-${TAG}.dmg"
          trap 'hdiutil detach "$mount" -quiet' EXIT
          app="$mount/Secure Agent.app"
          if [[ "$REQUIRE_SIGNED_DMG" == true ]]; then
            codesign --verify --strict "SecureAgent-${TAG}.dmg"
            xcrun stapler validate "SecureAgent-${TAG}.dmg"
            spctl -a -t open --context context:primary-signature -vv "SecureAgent-${TAG}.dmg"
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl -a -t exec -vv "$app"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")"
          [ "$version" = "${TAG#v}" ] || { echo "app version ${version}, tag ${TAG}" >&2; exit 1; }

  promote:
    name: Promote the validated pre-release
    needs: [prepare, macos-go, menubar, e2e, dmg]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.macos-go.result == 'success' && needs.menubar.result == 'success' &&
      needs.e2e.result == 'success' && needs.dmg.result == 'success' &&
      (inputs.tag != '' || (github.event_name == 'release' && github.event.release.prerelease))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: mark as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest

  # A release edited with the workflow token starts no other workflow, so the
  # documentation for the promoted release is published from here.
  docs:
    name: Publish documentation for the promoted release
    needs: [prepare, promote]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      publish: true
    secrets: inherit
