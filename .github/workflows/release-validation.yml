name: Release validation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-go:
    name: macOS Go vet + test + fmt
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (SHA-pinned)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5 (SHA-pinned)
        with:
          go-version-file: go.mod
      - name: gofmt check
        run: test -z "$(gofmt -l daemon cmd)" || { gofmt -l daemon cmd; exit 1; }
      - name: go vet
        run: go vet ./...
      # -race requires cgo. Production builds are CGO_ENABLED=0 (ordinary CI).
      - name: go test
        run: go test ./... -count=1 -race -shuffle=on -timeout 10m

  menubar:
    name: Swift package tests (macOS 27 SDK)
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (SHA-pinned)
        with:
          persist-credentials: false
      - name: swift test
        run: bash packaging/swift_macos.sh test --package-path menubar
      - name: Native status item lifecycle regression
        run: bash packaging/test/test_status_item_lifecycle.sh

  e2e:
    name: E2E smoke
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 (SHA-pinned)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5 (SHA-pinned)
        with:
          go-version-file: go.mod
      - name: smoke
        run: ./packaging/test/e2e_smoke.sh
      - name: sign identity unit tests
        run: bash packaging/test/test_sign_identity.sh
      - name: vcs stamp unit tests
        run: bash packaging/test/test_vcs_stamp.sh
      - name: install status unit tests
        run: bash packaging/test/test_install_status.sh
      - name: replaced bundle unit tests
        run: bash packaging/test/test_replaced_bundle.sh
      - name: live acceptance unit tests
        run: python3 packaging/test/test_live_acceptance.py
